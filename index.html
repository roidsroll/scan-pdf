<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pindai ke PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202F;--amber:#FFB400;--bg:#E8ECEF;--card:#fff;--line:#CBD3DA;--mute:#5B6B7A;font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--ink);color:#fff}
header h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;background:#22344A;border-radius:10px;padding:3px}
.tabs button{padding:7px 14px;border-radius:8px;color:#B8C6D4;font-weight:700;font-size:14px}
.tabs button.on{background:#fff;color:var(--ink)}
.tabs b{background:var(--amber);color:var(--ink);border-radius:9px;padding:0 6px;margin-left:5px;font-size:12px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
body[data-v=scan] #pagesV,body[data-v=pages] #scanV{display:none}
/* scan */
#scanV{flex:1;min-height:0;display:flex;flex-direction:column;background:#000}
.stage{flex:1;min-height:0;position:relative}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:contain}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(18,32,47,.82);color:#fff;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.hint.ok{background:var(--amber);color:var(--ink)}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#fff;padding:30px;line-height:1.5}
.msg.show{display:grid}
.bar{display:flex;align-items:center;justify-content:space-around;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:var(--ink)}
.side{width:58px;height:58px;border-radius:14px;background:#22344A;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;overflow:hidden;position:relative}
.side svg{width:24px;height:24px}
#last{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cnt{position:absolute;right:4px;bottom:4px;background:var(--amber);color:var(--ink);border-radius:9px;padding:0 6px;font-size:12px}
.shutter{width:76px;height:76px;border-radius:50%;background:var(--amber);border:5px solid #fff;box-shadow:0 0 0 3px var(--ink) inset}
.shutter:active{transform:scale(.94)}
/* pages */
#pagesV{flex:1;min-height:0;display:flex;flex-direction:column}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;align-content:start}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 20px;line-height:1.6}
.pg{background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;cursor:grab}
.pg.ghost{opacity:.35}
.pg .th{position:relative;background:#DDE3E8;aspect-ratio:3/4;display:grid;place-items:center;padding:8px}
.pg canvas{max-width:100%;max-height:100%;box-shadow:0 2px 8px rgba(18,32,47,.25);background:#fff}
.pg .n{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800}
.pg .acts{display:flex}
.pg .acts button{flex:1;padding:10px 0;font-size:17px;border-top:1px solid var(--line)}
.pg .acts button+button{border-left:1px solid var(--line)}
.pg .acts button:hover{background:#EEF2F5}
.pg .acts .del{color:#C0392B}
.export{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.fn{flex:1 1 200px;display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.fn:focus-within{border-color:var(--ink)}
.fn input{flex:1;min-width:0;border:0;padding:11px 12px;outline:0;font-weight:700}
.fn span{padding:0 12px;color:var(--mute);font-weight:700;background:#EEF2F5;align-self:stretch;display:grid;place-items:center}
select{padding:11px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.btn{background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-weight:800}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.ghost{background:#22344A;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* editor */
#ed{position:fixed;inset:0;background:#0B1520;display:none;flex-direction:column;z-index:20}
#ed.show{display:flex}
.edtop{display:flex;gap:6px;justify-content:center;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
.chip{padding:8px 14px;border-radius:99px;background:#22344A;color:#fff;font-weight:700;font-size:14px}
.chip.on{background:var(--amber);color:var(--ink)}
.edwrap{flex:1;min-height:0;display:grid;place-items:center;padding:6px 14px;touch-action:none}
#edc{touch-action:none;max-width:100%;max-height:100%}
.edbot{display:flex;gap:10px;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-v="scan">
<header>
  <h1>Pindai ke PDF</h1>
  <div class="tabs" role="tablist">
    <button id="tScan" class="on" role="tab">Kamera</button>
    <button id="tPages" role="tab">Halaman<b id="tc">0</b></button>
  </div>
</header>
<main>
  <section id="scanV">
    <div class="stage">
      <video id="vid" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div class="hint" id="hint">Arahkan kamera ke dokumen</div>
      <div class="msg" id="camMsg"></div>
    </div>
    <div class="bar">
      <label class="side" title="Pilih foto dari galeri" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        <input id="file" type="file" accept="image/*" multiple hidden>
      </label>
      <button class="shutter" id="shot" aria-label="Ambil foto"></button>
      <button class="side" id="toPages" aria-label="Lihat halaman">
        <img id="last" alt="" hidden><span id="cnt">0</span>
        <svg id="stk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg>
      </button>
    </div>
  </section>
  <section id="pagesV">
    <div class="grid" id="grid"></div>
    <div class="export">
      <label class="fn"><input id="name" maxlength="80" aria-label="Nama file" placeholder="Nama file"><span>.pdf</span></label>
      <select id="size" aria-label="Ukuran kertas"><option value="a4">Kertas A4</option><option value="fit">Sesuai hasil scan</option></select>
      <button class="btn amber" id="exp" disabled>Simpan PDF</button>
    </div>
  </section>
</main>

<div id="ed">
  <div class="edtop" id="chips">
    <button class="chip" data-f="asli">Asli</button>
    <button class="chip" data-f="dok">Dokumen</button>
    <button class="chip" data-f="bw">Hitam putih</button>
  </div>
  <div class="edwrap"><canvas id="edc"></canvas></div>
  <div class="edbot">
    <button class="btn ghost" id="edCancel">Batal</button>
    <button class="btn ghost" id="edReset">Seluruh foto</button>
    <button class="btn amber" id="edOk">Simpan</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const vid=$('#vid'),ov=$('#ov'),hint=$('#hint');
let pages=[],stream=null,live=false,timer=0,quad=null,miss=0,ed=null;

/* ---------- util ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
const tick=()=>new Promise(r=>setTimeout(r,16));
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `Scan_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
$('#name').value=stamp();

/* ---------- deteksi tepi kertas (ringan: Otsu + komponen terbesar) ---------- */
function detect(src,sw,sh){
  const W=128,H=Math.max(8,Math.round(W*sh/sw)),N=W*H;
  detect.c=detect.c||document.createElement('canvas');
  const c=detect.c;c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,g=new Uint8Array(N),hist=new Array(256).fill(0);
  for(let i=0;i<N;i++){const v=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;g[i]=v;hist[v]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let wB=0,sB=0,best=0,t=128;
  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,b=wB*wF*(mB-mF)**2;if(b>best){best=b;t=i}}
  const lab=new Uint8Array(N),stk=new Int32Array(N);let res=null,ba=0;
  for(let s=0;s<N;s++){
    if(lab[s]||g[s]<=t)continue;
    let sp=0,a=0;stk[sp++]=s;lab[s]=1;
    const K=[-1e9,-1e9,-1e9,-1e9],P=[[0,0],[0,0],[0,0],[0,0]];
    while(sp){
      const i=stk[--sp],px=i%W,py=(i/W)|0;a++;
      const k=[-(px+py),px-py,px+py,py-px];
      for(let j=0;j<4;j++)if(k[j]>K[j]){K[j]=k[j];P[j]=[px,py]}
      if(px>0&&!lab[i-1]&&g[i-1]>t){lab[i-1]=1;stk[sp++]=i-1}
      if(px<W-1&&!lab[i+1]&&g[i+1]>t){lab[i+1]=1;stk[sp++]=i+1}
      if(py>0&&!lab[i-W]&&g[i-W]>t){lab[i-W]=1;stk[sp++]=i-W}
      if(py<H-1&&!lab[i+W]&&g[i+W]>t){lab[i+W]=1;stk[sp++]=i+W}
    }
    if(a>ba){ba=a;res=P}
  }
  const r=ba/N;if(!res||r<.12||r>.93)return null;
  const q=res.map(p=>[(p[0]+.5)*sw/W,(p[1]+.5)*sh/H]);
  // pastikan bentuk masuk akal
  if(dist(q[0],q[1])<sw*.1||dist(q[0],q[3])<sh*.1)return null;
  return q;
}
const inset=(w,h,m=.08)=>[[w*m,h*m],[w*(1-m),h*m],[w*(1-m),h*(1-m)],[w*m,h*(1-m)]];

/* ---------- kamera ---------- */
async function startCam(){
  const m=$('#camMsg');m.classList.remove('show');
  if(!navigator.mediaDevices?.getUserMedia){m.innerHTML='Kamera tidak tersedia.<br>Buka lewat <b>https</b> atau <b>localhost</b>, atau pakai tombol galeri.';m.classList.add('show');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream;await vid.play();live=true;loop();
  }catch(e){m.innerHTML='Izin kamera ditolak atau kamera tidak ditemukan.<br>Izinkan kamera di pengaturan browser, atau pakai tombol galeri.';m.classList.add('show')}
}
function stopCam(){live=false;clearTimeout(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null}
function loop(){
  if(!live)return;
  if(vid.videoWidth&&!ed){
    const vw=vid.videoWidth,vh=vid.videoHeight,q=detect(vid,vw,vh);
    if(q){miss=0;
      if(quad)quad=quad.map((p,i)=>[p[0]+(q[i][0]-p[0])*.2,p[1]+(q[i][1]-p[1])*.2]);else quad=q;
    }else if(++miss>10)quad=null;
    drawOv(vw,vh);
  }
  timer=setTimeout(loop,60);
}
function drawOv(vw,vh){
  const dpr=devicePixelRatio||1,cw=ov.clientWidth,ch=ov.clientHeight;
  if(ov.width!==cw*dpr){ov.width=cw*dpr;ov.height=ch*dpr}
  const x=ov.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,cw,ch);
  hint.textContent=quad?'Dokumen terdeteksi':'Arahkan kamera ke dokumen';hint.classList.toggle('ok',!!quad);
  if(!quad)return;
  const s=Math.min(cw/vw,ch/vh),ox=(cw-vw*s)/2,oy=(ch-vh*s)/2,p=quad.map(a=>[ox+a[0]*s,oy+a[1]*s]);
  x.beginPath();p.forEach((a,i)=>i?x.lineTo(...a):x.moveTo(...a));x.closePath();
  x.fillStyle='rgba(255,180,0,.18)';x.fill();x.lineWidth=3;x.strokeStyle='#FFB400';x.lineJoin='round';x.stroke();
  x.fillStyle='#fff';p.forEach(a=>{x.beginPath();x.arc(a[0],a[1],5,0,7);x.fill()});
}
function cap(src,sw,sh,max=2400){
  const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return {c,k}
}
$('#shot').onclick=()=>{
  if(!vid.videoWidth){toast('Kamera belum siap');return}
  const {c,k}=cap(vid,vid.videoWidth,vid.videoHeight);
  const q=quad?quad.map(p=>[p[0]*k,p[1]*k]):inset(c.width,c.height);
  openEd({orig:c,q,filter:'dok',rot:0},true);
};
$('#file').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';
  for(const f of fs){
    try{
      const bmp=await createImageBitmap(f);
      const {c}=cap(bmp,bmp.width,bmp.height);
      const q=detect(c,c.width,c.height)||inset(c.width,c.height,.03);
      const p={orig:c,q,filter:'dok',rot:0};
      if(fs.length===1){openEd(p,true)}else{toast('Memproses…');await tick();build(p);pages.push(p);refresh()}
    }catch(_){toast('Gagal membuka gambar')}
  }
};

/* ---------- warp perspektif + filter ---------- */
function warp(p){
  const q=p.q,k0=1;
  let w=Math.max(dist(q[0],q[1]),dist(q[3],q[2])),h=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
  const k=Math.min(k0,1600/Math.max(w,h));w=Math.max(8,Math.round(w*k));h=Math.max(8,Math.round(h*k));
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q;
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  const den=dx1*dy2-dy1*dx2;
  const g=den?(dx3*dy2-dy3*dx2)/den:0,hh=den?(dx1*dy3-dy1*dx3)/den:0;
  const a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  const sw=p.orig.width,sh=p.orig.height,S=p.orig.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas');out.width=w;out.height=h;
  const ox=out.getContext('2d'),O=ox.createImageData(w,h),D=O.data;
  for(let j=0;j<h;j++){const v=(j+.5)/h;
    for(let i=0;i<w;i++){
      const u=(i+.5)/w,z=g*u+hh*v+1;
      let X=(a*u+b*v+x0)/z-.5,Y=(d*u+e*v+y0)/z-.5;
      X=X<0?0:X>sw-1.001?sw-1.001:X;Y=Y<0?0:Y>sh-1.001?sh-1.001:Y;
      const ix=X|0,iy=Y|0,fx=X-ix,fy=Y-iy,i00=(iy*sw+ix)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4,o=(j*w+i)*4;
      for(let c=0;c<3;c++)D[o+c]=S[i00+c]*(1-fx)*(1-fy)+S[i10+c]*fx*(1-fy)+S[i01+c]*(1-fx)*fy+S[i11+c]*fx*fy;
      D[o+3]=255;
    }}
  ox.putImageData(O,0,0);return out;
}
function filt(c,mode){
  if(mode==='asli')return c;
  const w=c.width,h=c.height,x=c.getContext('2d'),img=x.getImageData(0,0,w,h),D=img.data;
  const sm=document.createElement('canvas');sm.width=Math.max(2,Math.ceil(w/14));sm.height=Math.max(2,Math.ceil(h/14));
  const sx=sm.getContext('2d');sx.imageSmoothingQuality='high';sx.drawImage(c,0,0,sm.width,sm.height);
  const bg=document.createElement('canvas');bg.width=w;bg.height=h;
  const bx=bg.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(sm,0,0,w,h);
  const B=bx.getImageData(0,0,w,h).data;
  for(let i=0;i<D.length;i+=4){
    if(mode==='bw'){
      const gv=(D[i]*77+D[i+1]*150+D[i+2]*29)>>8,gb=((B[i]*77+B[i+1]*150+B[i+2]*29)>>8)+1,r=gv/gb;
      const v=Math.max(0,Math.min(255,(r-.62)/.3*255));D[i]=D[i+1]=D[i+2]=v;
    }else{
      for(let k=0;k<3;k++){const r=Math.min(1,D[i+k]/(B[i+k]+1)*1.04);D[i+k]=Math.pow(r,1.7)*255}
    }
  }
  x.putImageData(img,0,0);return c;
}
function build(p){p.base=filt(warp(p),p.filter)}
function final(p){
  const b=p.base,r=p.rot%4,odd=r%2,c=document.createElement('canvas');
  c.width=odd?b.height:b.width;c.height=odd?b.width:b.height;
  const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(r*Math.PI/2);x.drawImage(b,-b.width/2,-b.height/2);return c;
}

/* ---------- editor kotak potong ---------- */
const edc=$('#edc');
function openEd(p,isNew){
  ed={p,isNew,q:p.q.map(a=>a.slice()),filter:p.filter,drag:-1};
  $('#ed').classList.add('show');$('#edOk').textContent=isNew?'Tambah halaman':'Simpan';
  document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('on',b.dataset.f===ed.filter));
  requestAnimationFrame(()=>{
    const wrap=edc.parentElement,aw=wrap.clientWidth-28,ah=wrap.clientHeight-12;
    ed.s=Math.min(aw/p.orig.width,ah/p.orig.height);
    edc.width=Math.round(p.orig.width*ed.s);edc.height=Math.round(p.orig.height*ed.s);edDraw();
  });
}
function edDraw(){
  const x=edc.getContext('2d'),s=ed.s,w=edc.width,h=edc.height,p=ed.q.map(a=>[a[0]*s,a[1]*s]);
  x.clearRect(0,0,w,h);x.drawImage(ed.p.orig,0,0,w,h);
  x.beginPath();x.rect(0,0,w,h);p.forEach((a,i)=>i?x.lineTo(...a):x.moveTo(...a));x.closePath();
  x.fillStyle='rgba(8,16,26,.55)';x.fill('evenodd');
  x.lineWidth=2.5;x.strokeStyle='#FFB400';x.stroke();
  p.forEach(a=>{x.beginPath();x.arc(a[0],a[1],13,0,7);x.fillStyle='rgba(255,180,0,.9)';x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke()});
}
function edPos(e){const r=edc.getBoundingClientRect();return [(e.clientX-r.left)/r.width*edc.width/ed.s,(e.clientY-r.top)/r.height*edc.height/ed.s]}
edc.onpointerdown=e=>{
  const m=edPos(e);let bi=-1,bd=1e9;
  ed.q.forEach((a,i)=>{const d=dist(a,m)*ed.s;if(d<bd){bd=d;bi=i}});
  if(bd<44){ed.drag=bi;edc.setPointerCapture(e.pointerId)}
};
edc.onpointermove=e=>{
  if(ed.drag<0)return;const m=edPos(e),o=ed.p.orig;
  ed.q[ed.drag]=[Math.max(0,Math.min(o.width,m[0])),Math.max(0,Math.min(o.height,m[1]))];edDraw();
};
edc.onpointerup=edc.onpointercancel=()=>{if(ed)ed.drag=-1};
$('#chips').onclick=e=>{const f=e.target.dataset.f;if(!f)return;ed.filter=f;document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('on',b===e.target))};
$('#edReset').onclick=()=>{ed.q=inset(ed.p.orig.width,ed.p.orig.height,0);edDraw()};
$('#edCancel').onclick=()=>{$('#ed').classList.remove('show');ed=null};
$('#edOk').onclick=async()=>{
  const p=ed.p,isNew=ed.isNew;p.q=ed.q;p.filter=ed.filter;
  $('#edOk').disabled=true;toast('Memproses…');await tick();
  build(p);if(isNew)pages.push(p);
  $('#ed').classList.remove('show');ed=null;$('#edOk').disabled=false;
  refresh();toast(isNew?`Halaman ${pages.length} ditambahkan`:'Perubahan disimpan');
};

/* ---------- daftar halaman ---------- */
function showPreview(p){
  const v=document.createElement('div');
  v.style='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:grid;place-items:center;padding:20px;cursor:zoom-out';
  const img=new Image();img.src=final(p).toDataURL('image/jpeg',.9);
  img.style='max-width:100%;max-height:100%;box-shadow:0 0 30px rgba(0,0,0,.5)';
  v.appendChild(img);v.onclick=()=>v.remove();document.body.appendChild(v);
}
function thumb(p){
  const f=final(p),c=document.createElement('canvas'),k=Math.min(1,320/Math.max(f.width,f.height));
  c.width=Math.round(f.width*k);c.height=Math.round(f.height*k);c.getContext('2d').drawImage(f,0,0,c.width,c.height);return c;
}
function refresh(){
  const g=$('#grid');g.innerHTML='';
  $('#tc').textContent=pages.length;$('#cnt').textContent=pages.length;$('#exp').disabled=!pages.length;
  const last=$('#last');
  if(pages.length){last.src=thumb(pages[pages.length-1]).toDataURL('image/jpeg',.6);last.hidden=false;$('#stk').style.display='none'}else{last.hidden=true;$('#stk').style.display=''}
  if(!pages.length){g.innerHTML='<div class="empty"><b>Belum ada halaman</b><br>Ambil foto dokumen di tab Kamera<br>atau pilih foto dari galeri.</div>';return}
  pages.forEach((p,i)=>{
    const el=document.createElement('div');el.className='pg';el.dataset.i=i;
    el.innerHTML='<div class="th" title="Klik untuk preview"><span class="n">'+(i+1)+'</span></div><div class="acts"><button data-a="l" aria-label="Putar kiri">⟲</button><button data-a="r" aria-label="Putar kanan">⟳</button><button data-a="e" aria-label="Atur kotak" style="font-size:14px;font-weight:700">Potong</button><button class="del" data-a="d" aria-label="Hapus">✕</button></div>';
    const t=thumb(p);t.onclick=()=>showPreview(p);
    el.querySelector('.th').appendChild(t);g.appendChild(el);
  });
}
$('#grid').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.closest('.pg').dataset.i,p=pages[i],a=b.dataset.a;
  if(a==='l'){p.rot=(p.rot+3)%4;refresh()}
  else if(a==='r'){p.rot=(p.rot+1)%4;refresh()}
  else if(a==='d'){pages.splice(i,1);refresh()}
  else if(a==='e')openEd(p,false);
};
new Sortable($('#grid'),{animation:150,ghostClass:'ghost',filter:'button,.empty',delay:140,delayOnTouchOnly:true,
  onEnd(e){if(e.oldIndex===e.newIndex)return;const [m]=pages.splice(e.oldIndex,1);pages.splice(e.newIndex,0,m);refresh()}});

/* ---------- ekspor PDF ---------- */
$('#exp').onclick=async()=>{
  const btn=$('#exp');btn.disabled=true;
  try{
    const {jsPDF}=window.jspdf,a4=$('#size').value==='a4';let doc;
    for(let i=0;i<pages.length;i++){
      btn.textContent=`Membuat ${i+1}/${pages.length}…`;await tick();
      const c=final(pages[i]),land=c.width>c.height,o=land?'l':'p',img=c.toDataURL('image/jpeg',.85);
      let W,H,w,h,x,y;
      if(a4){W=land?297:210;H=land?210:297;const s=Math.min((W-10)/c.width,(H-10)/c.height);w=c.width*s;h=c.height*s;x=(W-w)/2;y=(H-h)/2}
      else{W=w=land?297:210;H=h=W*c.height/c.width;x=y=0}
      const fmt=a4?'a4':[W,H];
      if(!doc)doc=new jsPDF({unit:'mm',format:fmt,orientation:o});else doc.addPage(fmt,o);
      doc.addImage(img,'JPEG',x,y,w,h,undefined,'FAST');
    }
    const name=($('#name').value.trim().replace(/[\\/:*?"<>|]+/g,'_')||stamp());
    doc.save(name+'.pdf');toast('PDF tersimpan: '+name+'.pdf');
  }catch(err){toast('Gagal membuat PDF')}
  btn.textContent='Simpan PDF';btn.disabled=!pages.length;
};

/* ---------- tab ---------- */
function view(v){
  document.body.dataset.v=v;$('#tScan').classList.toggle('on',v==='scan');$('#tPages').classList.toggle('on',v==='pages');
  if(v==='scan')startCam();else stopCam();
}
$('#tScan').onclick=()=>view('scan');$('#tPages').onclick=()=>view('pages');$('#toPages').onclick=()=>view('pages');
refresh();startCam();
</script>
</body>
</html>
